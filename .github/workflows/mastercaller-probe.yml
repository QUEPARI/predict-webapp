name: Mastercaller connection test
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mastercaller-probe.yml
      - scripts/mastercaller/**
  push:
    branches: [codex/mastercaller-github-fetch]
    paths:
      - .github/workflows/mastercaller-probe.yml
      - scripts/mastercaller/**
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: npm ci --prefix scripts/mastercaller --ignore-scripts --no-audit --no-fund
      - run: ln -s "$PWD/scripts/mastercaller/node_modules" node_modules
      - run: node scripts/mastercaller/probe.mjs
